services:
  daemon:
    build: .
    ports:
      # Loopback-only publish: the container binds 0.0.0.0 internally, so never
      # expose the daemon to the LAN from the host side.
      - "127.0.0.1:7345:7345"
    volumes:
      - odw-data:/home/odw/.odw
    environment:
      - ODW_DAEMON_PORT=7345
      # Optional: pin the auth token instead of the auto-generated
      # ~/.odw/daemon.token inside the volume (64 hex chars).
      # - ODW_DAEMON_TOKEN=${ODW_DAEMON_TOKEN}
    restart: unless-stopped
    healthcheck:
      # /health is tokenless by design — the healthcheck needs no auth.
      test: ["CMD", "node", "-e", "fetch('http://localhost:7345/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  odw-data:
