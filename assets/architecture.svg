<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" fill="none" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" role="img" aria-label="how open dynamic workflows runs: you describe a workflow, a local script plans and fans out parallel agents, critics verify, you get one answer">
  <style><![CDATA[
    .nodePulse { transform-box: fill-box; transform-origin: center; }
    @keyframes agentArrive { 0%,28%{transform:scale(1);fill:#a5b4fc} 38%{transform:scale(1.18);fill:#c7d2fe} 54%,100%{transform:scale(1);fill:#a5b4fc} }
    @keyframes failBlink   { 0%,30%{opacity:.25} 45%{opacity:1} 70%,100%{opacity:.25} }
    @keyframes verifyPop   { 0%,70%{transform:scale(1)} 78%{transform:scale(1.12)} 90%,100%{transform:scale(1)} }
    @keyframes ripple      { 0%,70%{opacity:0;transform:scale(.6)} 80%{opacity:.5;transform:scale(1)} 100%{opacity:0;transform:scale(1.8)} }
    @keyframes critic      { 0%,55%{opacity:.4} 66%{opacity:1} 82%,100%{opacity:.4} }
    .ag  { animation: agentArrive 6s cubic-bezier(0.34,1.3,0.64,1) infinite; }
    .ag.a2{animation-delay:.1s} .ag.a3{animation-delay:.2s} .ag.a4{animation-delay:.3s} .ag.a5{animation-delay:.4s}
    .fail { animation: failBlink 6s ease-in-out infinite; }
    .vcore{ animation: verifyPop 6s cubic-bezier(0.34,1.2,0.64,1) infinite; }
    .vrip { transform-box: fill-box; transform-origin: center; animation: ripple 6s ease-out infinite; }
    .crit { animation: critic 6s ease-in-out infinite; }
    @keyframes pktOn { 0%,100%{opacity:.95} }
    .pkt { animation: pktOn 6s infinite; }
    @media (prefers-reduced-motion: reduce){ *{animation:none!important} [data-motion]{display:none!important} }
  ]]></style>
  <defs>
    <linearGradient id="ind" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0.9"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#6366f1"/>
    </marker>
  </defs>

  <!-- faint baseline tying the flow together -->
  <line x1="80" y1="300" x2="1120" y2="300" stroke="#8b8fa3" stroke-opacity="0.25" stroke-width="1.5" stroke-dasharray="2 6"/>

  <!-- spine edges between columns -->
  <g stroke="url(#edge)" stroke-width="2.5" fill="none" marker-end="url(#arrow)">
    <!-- you → script -->
    <path d="M210 210 C 260 210, 280 210, 300 210"/>
    <!-- script → fan of agents -->
    <path d="M470 210 C 540 150, 560 110, 626 92"/>
    <path d="M470 210 C 540 130, 560 151, 626 151"/>
    <path d="M470 210 H626"/>
    <path d="M470 210 C 540 290, 560 269, 626 269"/>
    <path d="M470 210 C 540 270, 560 300, 626 318"/>
    <!-- agents → verify (converge) -->
    <path d="M654 92  C 760 110, 880 180, 994 204"/>
    <path d="M654 210 C 760 210, 880 210, 994 210"/>
    <path d="M654 318 C 760 300, 880 240, 994 216"/>
  </g>

  <!-- travelling data packets (overlay, motion-only; hidden at rest): you→script→agents→verify -->
  <g stroke="#c7d2fe" stroke-width="3.5" fill="none" stroke-linecap="round" opacity="0" class="pkt" data-motion="1">
    <!-- beat 1: you → script -->
    <path d="M210 210 C 260 210, 280 210, 300 210" pathLength="100" stroke-dasharray="12 88" stroke-dashoffset="100">
      <animate attributeName="stroke-dashoffset" begin="0s" dur="6s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.16;1" values="100;0;0" keySplines="0.4 0 0.2 1;0 0 1 1"/></path>
    <!-- beat 2: script → 5 agents (staggered) -->
    <path d="M470 210 C 540 150, 560 110, 626 92" pathLength="100" stroke-dasharray="12 88" stroke-dashoffset="100">
      <animate attributeName="stroke-dashoffset" begin="0s" dur="6s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.18;0.40;1" values="100;100;0;0" keySplines="0 0 1 1;0.4 0 0.2 1;0 0 1 1"/></path>
    <path d="M470 210 C 540 130, 560 151, 626 151" pathLength="100" stroke-dasharray="12 88" stroke-dashoffset="100">
      <animate attributeName="stroke-dashoffset" begin="0.06s" dur="6s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.18;0.40;1" values="100;100;0;0" keySplines="0 0 1 1;0.4 0 0.2 1;0 0 1 1"/></path>
    <path d="M470 210 H626" pathLength="100" stroke-dasharray="12 88" stroke-dashoffset="100">
      <animate attributeName="stroke-dashoffset" begin="0.12s" dur="6s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.18;0.40;1" values="100;100;0;0" keySplines="0 0 1 1;0.4 0 0.2 1;0 0 1 1"/></path>
    <path d="M470 210 C 540 290, 560 269, 626 269" pathLength="100" stroke-dasharray="12 88" stroke-dashoffset="100">
      <animate attributeName="stroke-dashoffset" begin="0.18s" dur="6s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.18;0.40;1" values="100;100;0;0" keySplines="0 0 1 1;0.4 0 0.2 1;0 0 1 1"/></path>
    <path d="M470 210 C 540 270, 560 300, 626 318" pathLength="100" stroke-dasharray="12 88" stroke-dashoffset="100">
      <animate attributeName="stroke-dashoffset" begin="0.24s" dur="6s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.18;0.40;1" values="100;100;0;0" keySplines="0 0 1 1;0.4 0 0.2 1;0 0 1 1"/></path>
    <!-- beat 3: agents → verify (converge) -->
    <path d="M654 92  C 760 110, 880 180, 994 204" pathLength="100" stroke-dasharray="12 88" stroke-dashoffset="100">
      <animate attributeName="stroke-dashoffset" begin="0s" dur="6s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.48;0.70;1" values="100;100;0;0" keySplines="0 0 1 1;0.4 0 0.2 1;0 0 1 1"/></path>
    <path d="M654 210 C 760 210, 880 210, 994 210" pathLength="100" stroke-dasharray="12 88" stroke-dashoffset="100">
      <animate attributeName="stroke-dashoffset" begin="0.08s" dur="6s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.48;0.70;1" values="100;100;0;0" keySplines="0 0 1 1;0.4 0 0.2 1;0 0 1 1"/></path>
    <path d="M654 318 C 760 300, 880 240, 994 216" pathLength="100" stroke-dasharray="12 88" stroke-dashoffset="100">
      <animate attributeName="stroke-dashoffset" begin="0.16s" dur="6s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.48;0.70;1" values="100;100;0;0" keySplines="0 0 1 1;0.4 0 0.2 1;0 0 1 1"/></path>
  </g>

  <!-- COL 1 — YOU -->
  <g>
    <rect x="36" y="186" width="178" height="48" rx="8" fill="none" stroke="#6366f1" stroke-width="1.5"/>
    <text x="125" y="215" font-size="13" fill="#6366f1" text-anchor="middle">workflow: audit auth</text>
    <text x="125" y="276" font-size="12" fill="#8b8fa3" text-anchor="middle" letter-spacing="1">YOU</text>
  </g>

  <!-- COL 2 — THE SCRIPT (daemon, dark to echo the terminal) -->
  <g>
    <rect x="300" y="168" width="170" height="84" rx="14" fill="#1a1b22"/>
    <path d="M300 182 a14 14 0 0 1 14 -14 h142 a14 14 0 0 1 14 14 v6 h-170 z" fill="#24262f"/>
    <circle cx="315" cy="178" r="3" fill="#ef4444"/>
    <circle cx="326" cy="178" r="3" fill="#facc15"/>
    <circle cx="337" cy="178" r="3" fill="#22c55e"/>
    <text x="385" y="182" font-size="11" fill="#8b8fa3" text-anchor="middle">orchestrator.js</text>
    <text x="385" y="214" font-size="14" fill="#c7d2fe" text-anchor="middle">the script</text>
    <text x="385" y="236" font-size="10.5" fill="#9aa0b4" text-anchor="middle">local daemon · no model in the loop</text>
    <text x="385" y="276" font-size="12" fill="#8b8fa3" text-anchor="middle" letter-spacing="1">THE SCRIPT</text>
  </g>

  <!-- COL 3 — PARALLEL AGENTS (fan; two carry a failure dot) -->
  <g>
    <circle cx="640" cy="92" r="14" fill="#a5b4fc" class="nodePulse ag a1"/>
    <circle cx="640" cy="151" r="14" fill="#a5b4fc" class="nodePulse ag a2"/>
    <circle cx="640" cy="210" r="14" fill="#a5b4fc" class="nodePulse ag a3"/>
    <circle cx="640" cy="269" r="14" fill="#a5b4fc" class="nodePulse ag a4"/>
    <circle cx="640" cy="318" r="14" fill="#a5b4fc" class="nodePulse ag a5"/>
    <!-- two agents fail; the run survives -->
    <circle cx="647" cy="85" r="4" fill="#facc15" class="fail"/>
    <circle cx="647" cy="262" r="4" fill="#facc15" class="fail"/>
    <text x="640" y="360" font-size="12" fill="#8b8fa3" text-anchor="middle" letter-spacing="1">PARALLEL AGENTS</text>
  </g>

  <!-- COL 4 — ADVERSARIAL VERIFY -->
  <g>
    <circle cx="1020" cy="210" r="24" fill="none" stroke="#22c55e" stroke-width="2" opacity="0" class="vrip" data-motion="1"/>
    <circle cx="1020" cy="210" r="24" fill="url(#ind)" class="nodePulse vcore"/>
    <path d="M1009 210 l7 8 l15 -18" stroke="#ffffff" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- two critics feeding in -->
    <circle cx="966" cy="150" r="9" fill="#ef4444" class="crit"/>
    <circle cx="966" cy="270" r="9" fill="#22c55e" class="crit"/>
    <g stroke="url(#edge)" stroke-width="2" fill="none" marker-end="url(#arrow)">
      <path d="M974 156 C 990 170, 998 185, 1002 196"/>
      <path d="M974 264 C 990 250, 998 235, 1002 224"/>
    </g>
    <text x="1020" y="262" font-size="11" fill="#8b8fa3" text-anchor="middle">critics</text>
    <text x="1020" y="312" font-size="12" fill="#8b8fa3" text-anchor="middle" letter-spacing="1">ADVERSARIAL VERIFY</text>
  </g>
</svg>
